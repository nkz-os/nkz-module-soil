# AgriSoilExtended (SDM-001)
purpose: |
  Extension of FIWARE AgriSoil to support precision-agriculture soil characterization
  with multi-horizon profiles, particle-size distribution, organic carbon, bulk density,
  hydraulic properties, and full per-attribute provenance metadata.

upstream_alignment:
  base: AgriSoil (SmartAgriFood)
  relationship: extension
  rationale: |
    Official AgriSoil exposes only 5 attributes (description, location, alternateName,
    agroVocConcept, seeAlso). Real precision-agriculture systems require depth-resolved
    profiles with hydraulic properties for irrigation, drainage, and crop modeling.

attribute_provenance:
  per_attribute_subproperties:
    - providedBy
    - license
    - confidenceInterval
    - derivedBy
    - observedAt

units:
  reference: UN/CEFACT
  examples:
    bulkDensity: GL3 (g/cm³)
    saturatedHydraulicConductivity: F61 (cm/h)
    organicCarbon: P1 (% mass)
    availableWaterCapacity: H51 (cm³/cm³)

tillage_limits:
  version: "1"
  wetTillageLimit: |
    saturation - 0.10 m3/m3: water content at an air-filled porosity of 0.10 m3/m3.
    Obour P.B. (2018), PhD thesis, Aarhus University, p. 45 ("new approach");
    Obour et al. (2019), Soil & Tillage Research. The authors call the fixed 0.10
    "somewhat arbitrary".
  dryTillageLimit: |
    Permanent wilting point (-1500 kPa, Saxton & Rawls 2006): below it a seed
    cannot take up water. Physical definition chosen for the platform, not a
    published tillage limit.
  absent_when: "no saturation or wilting point, or saturation - 0.10 <= wilting point"

saturation_bound:
  rule: "saturation = min(Saxton-Rawls 2006 saturation, totalPorosity) when bulk density is known"
  totalPorosity: "1 - bulkDensity / 2.65 (standard mineral particle density). Water cannot fill more than the pore space; organic matter lowers the real particle density, so the bound is conservative."
  not_recomputed: "ksatSaturated keeps the regression value (computed from the unbounded saturation)."
pedotransferOutOfCalibration: "True when organic matter (organic carbon x 1.724) > 8 % or clay > 60 %: outside the range of the Saxton-Rawls 2006 regressions, so their values are extrapolations."
